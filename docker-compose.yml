services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ftf
      POSTGRES_PASSWORD: ftf
      POSTGRES_DB: ftf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftf"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/ftf;
      exit 0;
      "

  api:
    build: { context: ., dockerfile: app.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports:
      - "8000:8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000

  worker:
    build: { context: ., dockerfile: app.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery -A app.celery_app.celery worker --loglevel=info
