# Self-contained stack for a Coolify demo deploy.
# No host Docker socket: the worker runs the compute in a subprocess (RUN_MODE=subprocess).
# Only the API is exposed publicly; redis/postgres/minio stay on the internal network.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ftf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftf}
      POSTGRES_DB: ftf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftf"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do sleep 1; done;
      /usr/bin/mc mb -p local/ftf;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: app.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ftf:${POSTGRES_PASSWORD:-ftf}@postgres:5432/ftf
      BROKER_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ftf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: app.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ftf:${POSTGRES_PASSWORD:-ftf}@postgres:5432/ftf
      BROKER_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ftf
      RUN_MODE: subprocess
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: celery -A app.celery_app.celery worker --loglevel=info

volumes:
  pgdata:
  miniodata:
